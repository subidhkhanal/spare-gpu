<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="spare-gpu: chat commands that make BharatCode Desktop do more">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1410"/>
      <stop offset="1" stop-color="#2a1d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a35"/>
      <stop offset="1" stop-color="#e1ba00"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect x="0" y="352" width="1280" height="8" fill="url(#accent)"/>

  <!-- title -->
  <text x="72" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#fff4ec">spare<tspan fill="#ff6a35">-</tspan>gpu</text>
  <text x="76" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#d8c8bc">Chat commands that make BharatCode Desktop do more</text>
  <text x="76" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#a8968a">answers · reviews · research · memory · cost · checks</text>

  <!-- twelve features, one tile each, all alike -->
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#fff4ec" text-anchor="middle">
    <g fill="#120c09" stroke="#3a2c24">
      <rect x="724" y="64" width="156" height="46" rx="9"/><rect x="890" y="64" width="156" height="46" rx="9"/><rect x="1056" y="64" width="156" height="46" rx="9"/>
      <rect x="724" y="122" width="156" height="46" rx="9"/><rect x="890" y="122" width="156" height="46" rx="9"/><rect x="1056" y="122" width="156" height="46" rx="9"/>
      <rect x="724" y="180" width="156" height="46" rx="9"/><rect x="890" y="180" width="156" height="46" rx="9"/><rect x="1056" y="180" width="156" height="46" rx="9"/>
      <rect x="724" y="238" width="156" height="46" rx="9"/><rect x="890" y="238" width="156" height="46" rx="9"/><rect x="1056" y="238" width="156" height="46" rx="9"/>
    </g>
    <g fill="#ff6a35">
      <rect x="724" y="64" width="5" height="46" rx="2"/><rect x="890" y="64" width="5" height="46" rx="2"/><rect x="1056" y="64" width="5" height="46" rx="2"/>
      <rect x="724" y="122" width="5" height="46" rx="2"/><rect x="890" y="122" width="5" height="46" rx="2"/><rect x="1056" y="122" width="5" height="46" rx="2"/>
      <rect x="724" y="180" width="5" height="46" rx="2"/><rect x="890" y="180" width="5" height="46" rx="2"/><rect x="1056" y="180" width="5" height="46" rx="2"/>
      <rect x="724" y="238" width="5" height="46" rx="2"/><rect x="890" y="238" width="5" height="46" rx="2"/><rect x="1056" y="238" width="5" height="46" rx="2"/>
    </g>
    <text x="804" y="92">/auto</text><text x="970" y="92">/apply /undo</text><text x="1136" y="92">/code-review</text>
    <text x="804" y="150">/security-review</text><text x="970" y="150">/deep-research</text><text x="1136" y="150">/simplify</text>
    <text x="804" y="208">/verify-app</text><text x="970" y="208">/remember</text><text x="1136" y="208">/handoff /pickup</text>
    <text x="804" y="266">/cost</text><text x="970" y="266">/prompts</text><text x="1136" y="266">/doctor</text>
  </g>
</svg>
