[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spare-gpu"
dynamic = ["version"]
description = "Repo chores (tests, docs, code review) as background BharatCode Desktop sessions, each on its own git branch, on whichever model starts sooner."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["bharatcode", "llm", "code-review", "testing", "documentation", "scheduler", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/subidhkhanal/spare-gpu"
Source = "https://github.com/subidhkhanal/spare-gpu"
Issues = "https://github.com/subidhkhanal/spare-gpu/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
]
build = [
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
gtu = "gpu_token_utilization.cli:app"

[tool.hatch.version]
path = "src/gpu_token_utilization/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_token_utilization"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "BharatCode.txt", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
