[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spare-gpu"
version = "0.0.1"
description = "Your repo's night watchman. Queue the work you keep putting off; review it with your coffee."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
]

[project.scripts]
gtu = "gpu_token_utilization.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_token_utilization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
